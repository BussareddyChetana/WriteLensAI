{% extends 'base.html' %}

{% block title %}Register Account — WriteLens AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-user-plus text-primary display-4 mb-2"></i>
                    <h3 class="fw-bold brand-font">Create Account</h3>
                    <p class="text-muted small">Join WriteLens AI for full detection & PDF export access</p>
                </div>

                <form action="{{ url_for('auth.register') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="johndoe" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label font-weight-bold">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label font-weight-bold">Confirm Password</label>
                            <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 mb-3">Create Free Account</button>
                </form>

                <div class="text-center mt-3">
                    <span class="small text-muted">Already have an account? </span>
                    <a href="{{ url_for('auth.login') }}" class="small fw-bold text-primary text-decoration-none">Log in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
