{% extends 'base.html' %}

{% block title %}Log In — WriteLens AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-eye-slash text-primary display-4 mb-2"></i>
                    <h3 class="fw-bold brand-font">Welcome Back</h3>
                    <p class="text-muted small">Sign in to access your WriteLens AI dashboard</p>
                </div>

                <form action="{{ url_for('auth.login') }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" name="login_input" class="form-control" placeholder="username or email@example.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label font-weight-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="remember" id="remember">
                            <label class="form-check-label small" for="remember">Remember me</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 mb-3">Sign In</button>
                </form>

                <div class="text-center mt-3">
                    <span class="small text-muted">Don't have an account? </span>
                    <a href="{{ url_for('auth.register') }}" class="small fw-bold text-primary text-decoration-none">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
